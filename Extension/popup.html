<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LeetCode GitHub Sync</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      background: #2ea44f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: green;
    }
    #lastSync {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      font-size: 12px;
    }
    #lastSync .label {
      color: #555;
      font-weight: bold;
      margin-bottom: 4px;
    }
    #lastSync .title {
      font-weight: bold;
    }
    #lastSync .time {
      color: #888;
      font-size: 11px;
      margin-top: 2px;
    }
    #historyList {
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
    }
    .history-item {
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 11px;
    }
    .history-item .title {
      font-weight: bold;
    }
    .history-item .time {
      color: #888;
    }
    #toggleHistory {
      background: none;
      color: #0366d6;
      border: none;
      padding: 0;
      margin-top: 8px;
      width: auto;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>LeetCode GitHub Sync — Settings</h2>

  <label for="token">GitHub Personal Access Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

  <label for="repo">Repo (owner/repo-name)</label>
  <input type="text" id="repo" placeholder="HammadAli-art/Java-DSA">

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <div id="lastSync"></div>
  <button id="toggleHistory">Show recent history</button>
  <div id="historyList" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
